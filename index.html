<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Mario Velásquez — Orador motivacional y autor que ayuda a familias y jóvenes a construir una vida con propósito." />
  <title>Mario Velásquez — Conferencista y Autor</title>

  <!-- Open Graph / WhatsApp, Facebook, etc. link preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mariovelasquez.com/" />
  <meta property="og:title" content="Mario Velásquez — Conferencista y Autor" />
  <meta property="og:description"
    content="Orador motivacional y autor que ayuda a familias y jóvenes a construir una vida con propósito." />
  <meta property="og:image" content="https://mariovelasquez.com/og-image.jpg" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="576" />
  <meta property="og:locale" content="es_ES" />

  <!-- Twitter Card (harmless extra; some apps fall back to it) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mario Velásquez — Conferencista y Autor" />
  <meta name="twitter:description"
    content="Orador motivacional y autor que ayuda a familias y jóvenes a construir una vida con propósito." />
  <meta name="twitter:image" content="https://mariovelasquez.com/og-image.jpg" />

  <!-- Google Fonts: only the families/weights actually used (Playfair Display:
       400/600/700 for headings, Inter: 400/500 for body text). Loaded async
       (preload + print-media swap trick) so the font CSS never blocks first paint. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet" />
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
